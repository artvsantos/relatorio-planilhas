[project]
name = "relatorio-planilhas"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Captura a saída pelo Python, sem trocar o stdout/stderr do processo a cada
# teste: o Tcl da janela guarda os que encontrou e, com a troca, de vez em
# quando fechava o arquivo errado e a janela seguinte não abria.
addopts = "--capture=sys"
# Erro escondido em thread ou ao apagar objeto do tkinter quebra o teste,
# em vez de virar só um aviso no fim.
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
source = ["sales_report"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
