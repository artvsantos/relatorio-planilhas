name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows porque é onde quem usa planilha costuma rodar.
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes, com cobertura
        run: pytest --cov

      - name: Relatório das planilhas de exemplo
        run: python -m sales_report exemplos/vendas -o relatorio.xlsx
