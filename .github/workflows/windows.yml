name: Programa para Windows

# Gera o RelatorioDeVendas.exe a cada mudança na main e confere se ele abre.
# Numa tag de versão (v1.0.0, v1.1.0...), também publica o .exe na página de
# Releases, de onde quem não programa baixa e usa.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  exe:
    name: Gerar o .exe
    runs-on: windows-latest
    permissions:
      contents: write # para publicar na página de Releases
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-build.txt

      - name: Gerar o .exe
        run: pyinstaller RelatorioDeVendas.spec

      # Se faltar alguma parte dentro do .exe, ele quebra ao abrir. Aqui ele
      # é aberto de verdade e só passa se a janela do programa aparecer.
      - name: Conferir se o .exe abre a janela
        run: |
          Start-Process dist\RelatorioDeVendas.exe
          $title = $null
          foreach ($i in 1..120) {
            Start-Sleep -Milliseconds 500
            $title = Get-Process RelatorioDeVendas -ErrorAction SilentlyContinue |
              Where-Object MainWindowTitle |
              Select-Object -ExpandProperty MainWindowTitle -First 1
            if ($title) { break }
          }
          Stop-Process -Name RelatorioDeVendas -Force -ErrorAction SilentlyContinue
          if ($title -notlike 'Relat*rio de vendas') {
            throw "A janela do programa não abriu (título: '$title')"
          }

      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create $env:TAG dist\RelatorioDeVendas.exe
          --title "Relatório de vendas $env:TAG"
          --notes-file .github/release-notes.md
